<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homework3</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
    /* body styling */
        body {
            background-image: url(h.w3\ img.jpeg);
        }


      

/* main div styling */
        .main {
            display: flex;
            flex-direction: column;
            background-color: rgba(234, 227, 227, 0.594);
            width: 300px;
            height: 300px;
            padding: 10px;
            margin: auto;
        }

        main {
            margin-top: 150px;
            

        }

        /* the first section styling */
        .sec1 {
            display: flex;
            flex-direction: column;
            margin: auto;
            align-items: center;
        }

        /* forms in section 1 styling */
        input[type="text"],input[type="password"],input[type="submit"] {
            margin: 5px;
            padding: 10px;
            width: 95%;
            background-color: rgba(234, 227, 227, 0.53);
            border: 0;
        }
        
/* the 2nd section styling */
        .sec2 {
          display: flex;
          flex-direction: row;
          justify-content: space-between;
          margin-top: 0;

        }
    </style>
</head>

<body>
    <main>
        <div class="main">
            <section class="sec1">
                <h2>Account Login</h2>
                <form>
                    <input type="text" placeholder="User name">
                    <input type="password" placeholder="password">
                    <input type="submit" value="LOGIN" style="background-color: rgb(9, 126, 9); color: white;">
                </form>
            </section>

            <section class="sec2">

                <form>
                    <input type="checkbox"><label>remember me</label>
                </form>
                <a href="">forgot password?</a>





            </section>
        </div>

    </main>
</body>

</html>
